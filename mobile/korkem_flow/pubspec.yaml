name: korkem_flow
description: "KORKEM Flow — mobile client for the KORKEM furniture manufacturing OS."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  # HTTP — chosen for its interceptor pipeline (auth refresh, retry)
  dio: ^5.11.0
  flex_color_scheme: ^8.4.0
  flutter:
    sdk: flutter
  # Declarative animation chains where implicit animation is not enough
  flutter_animate: ^4.5.2
  flutter_localizations:
    sdk: flutter
  # State + DI in one tool (docs/mobile_architecture.md §2)
  flutter_riverpod: ^3.4.1
  # Keychain / EncryptedSharedPreferences
  flutter_secure_storage: ^10.3.1
  go_router: ^17.3.0
  intl: ^0.20.2
  # Material 3's native icon set; variable fill axis drives selected state
  material_symbols_icons: ^4.2960.0
  meta: ^1.16.0
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2

dev_dependencies:
  # Declared rather than leaned on transitively through flutter_test. The undo
  # window is a timing feature, and testing it by actually waiting six seconds
  # per case is not a test suite anyone will keep running.
  fake_async: ^1.3.3
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
  very_good_analysis: ^10.3.0

flutter:
  uses-material-design: true
  generate: true

  # No `assets:` block, and that is a decision rather than an omission. The
  # only decorative element in the app — the mark on an empty, error or
  # success state — is drawn from theme colours by `StateIllustration`, not
  # shipped as artwork. See `docs/design_system.md` §8 for why. Declaring
  # empty `images/` and `lottie/` directories advertised the opposite.

  fonts:
    # Bundled, not fetched at runtime: google_fonts would make first paint
    # depend on a third-party host. Verified to cover Kazakh — see
    # THIRD_PARTY_LICENSES.md.
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf

# Launcher icon, generated from assets/icon/ — which is itself rendered from the
# design tokens by test/tools/generate_app_icon_test.dart. Regenerate with:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: assets/icon/app_icon.png
  android: true
  ios: false
  remove_alpha_ios: true
  # Adaptive icon: a solid brand-dark plate with the glyph floating in the
  # mask-safe centre, so any launcher shape crops cleanly.
  adaptive_icon_background: "#121212"
  adaptive_icon_foreground: assets/icon/app_icon_foreground.png
  # Monochrome layer for Android 13+ themed icons.
  adaptive_icon_monochrome: assets/icon/app_icon_foreground.png

# Launch screen. Matches the Splash route the app itself shows while it
# restores a stored credential, so the handover is invisible.
#   dart run flutter_native_splash:create
flutter_native_splash:
  color: "#FCFDFB"
  color_dark: "#121212"
  image: assets/icon/app_icon_foreground.png
  image_dark: assets/icon/app_icon_foreground.png
  android_12:
    color: "#FCFDFB"
    color_dark: "#121212"
    image: assets/icon/app_icon_foreground.png
    image_dark: assets/icon/app_icon_foreground.png
  android: true
  ios: false
  web: false
