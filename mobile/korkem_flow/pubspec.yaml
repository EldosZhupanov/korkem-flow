name: korkem_flow
description: "KORKEM Flow — mobile client for the KORKEM furniture manufacturing OS."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  # HTTP — chosen for its interceptor pipeline (auth refresh, retry)
  dio: ^5.11.0
  file_picker: ^12.2.0
  flex_color_scheme: ^8.4.0
  flutter:
    sdk: flutter
  # Declarative animation chains where implicit animation is not enough
  flutter_animate: ^4.5.2
  flutter_localizations:
    sdk: flutter
  # Renders the assistant's replies. The maintained successor to the
  # discontinued flutter_markdown (BSD-3). Replies are authored as Markdown
  # even while they are canned, because that is what a real model returns —
  # so connecting one changes who writes the string, not how it is drawn.
  flutter_markdown_plus: ^1.0.12
  # State + DI in one tool (docs/mobile_architecture.md §2)
  flutter_riverpod: ^3.4.1
  # Keychain / EncryptedSharedPreferences
  flutter_secure_storage: ^10.3.1
  go_router: ^17.3.0
  # Camera and gallery attachment on measurement step (BSD-3).
  # Uses Android Photo Picker / system camera contract; safe under R8.
  image_picker: ^1.1.2
  intl: ^0.20.2
  # Material 3's native icon set; variable fill axis drives selected state
  material_symbols_icons: ^4.2960.0
  meta: ^1.16.0
  shared_preferences: ^2.5.5
  # The assistant's replies arrive on Frappe's socket.io channel rather than
  # on the HTTP response: an LLM call is queued server-side (ADR-0009), so
  # there is no response to hold open. Frappe's socket.io is v4.
  socket_io_client: ^3.1.2
  # Dictation into the message field, using the device's own recogniser (BSD-3).
  # No cloud key and no server of ours — but Android routes this through a
  # platform service, which docs/privacy_policy.md has to say.
  speech_to_text: ^7.4.0
  url_launcher: ^6.3.2

dev_dependencies:
  # Declared rather than leaned on transitively through flutter_test. The undo
  # window is a timing feature, and testing it by actually waiting six seconds
  # per case is not a test suite anyone will keep running.
  fake_async: ^1.3.3
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  flutter_test:
    sdk: flutter
  # Drives the real app against a real backend. The unit and widget suites
  # prove behaviour with the network faked; this is the only thing that
  # exercises FrappeSocketChannel, which is exactly the layer they cannot reach.
  integration_test:
    sdk: flutter
  mocktail: ^1.0.4
  very_good_analysis: ^10.3.0

flutter:
  uses-material-design: true
  generate: true

  # Only the brand. Illustration is still drawn from theme colours rather than
  # shipped (see `docs/design_system.md` §8) — but a logo cannot be, and this
  # one especially: a woven Kazakh ornament inside a serif O is not something
  # tokens arrive at. Both files are alpha masks, tinted at runtime, so one
  # asset is correct on cream and on forest.
  assets:
    - assets/brand/

  fonts:
    # Bundled, not fetched at runtime: google_fonts would make first paint
    # depend on a third-party host. Verified to cover Kazakh — see
    # THIRD_PARTY_LICENSES.md.
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf

# Launcher icon, cut from the official logo in `logo/`. Regenerate with:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: assets/brand/icon_play.png
  android: true
  ios: false
  remove_alpha_ios: true
  # The brand field, so the icon is the logo rather than a logo on a plate.
  adaptive_icon_background: "#2B382A"
  # The ring and its lattice, without the umlaut ornaments: at 48dp those
  # become specks while the ring still reads. Verified by rendering both at
  # 192, 96 and 48px before choosing.
  adaptive_icon_foreground: assets/brand/icon_foreground.png
  # Themed icons, Android 13+. A separate white-on-transparent master, because
  # the launcher recolours this layer and a cream one would tint twice.
  adaptive_icon_monochrome: assets/brand/icon_monochrome.png
  # Windows is deliberately NOT generated here. This tool emits a .ico with a
  # single 256px frame, and Windows then downscales it for the taskbar and
  # Alt-Tab, where the ring turns to mush at 16-24px. The committed
  # windows/runner/resources/app_icon.ico carries seven real frames
  # (16..256) — see docs/operations/WINDOWS_DESKTOP.md for the command that
  # rebuilds it. Do not add a `windows:` key back: it would overwrite them.

# Launch screen. The brand field in both themes; the Splash route the app draws
# itself does the same, so the handover from the system splash is invisible.
#   dart run flutter_native_splash:create
flutter_native_splash:
  color: "#2B382A"
  color_dark: "#2B382A"
  image: assets/brand/icon_monochrome.png
  image_dark: assets/brand/icon_monochrome.png
  android_12:
    color: "#2B382A"
    color_dark: "#2B382A"
    image: assets/brand/icon_monochrome.png
    image_dark: assets/brand/icon_monochrome.png
  android: true
  ios: false
  web: false
