# KORKEM Flow — CI
#
# STATUS: PREPARED, NOT REMOTELY VERIFIED. This repository has no remote yet
# (`git remote -v` is empty), so nothing has ever triggered this file. What
# changed on 2026-08-31 is that it is now *able* to work: the monorepo carries
# both custom apps, and `vendor.lock` + `scripts/fetch_vendor.sh` restore the
# four upstream projects at fixed commits. Before that, a checkout contained
# neither the Python under test nor a way to obtain the framework.
#
# Both jobs call `scripts/ci.sh`, which is the same command a developer runs on
# their own machine. That is deliberate: a pipeline whose steps exist only in
# YAML can only be debugged by pushing.
#
# Do not describe this as green until a real run says so.

name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

# A second push to dev supersedes the first: the backend suite is ~25 minutes
# and there is no value in two of them racing.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter — analyze, format, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Pinned deliberately. The client is built against this toolchain and
          # `very_good_analysis` moves with it; `channel: stable` would let an
          # unrelated Flutter release redden this repository.
          flutter-version: '3.44.8'

      - name: Verify
        run: ./scripts/ci.sh flutter

  backend:
    name: Backend — korkem_manufacturing, korkem_ai
    runs-on: ubuntu-latest
    # ~25 minutes for korkem_ai, plus a first-boot bootstrap that clones three
    # apps and builds assets.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # A hosted runner has about 14 GB free, and this job needs more than that:
      # four vendored clones with full history (3.8 GB), the bench image, and
      # `node_modules` for three front ends. Without this step `yarn install`
      # dies mid-extraction with
      #
      #     ENOSPC: no space left on device, write
      #
      # reported per package as "the file appears to be corrupt", which reads
      # like a broken download from the registry and is not.
      #
      # The clones cannot be shallowed: bench reads `git describe` and tags,
      # so the history has to be there. What can go is the runner's
      # preinstalled tooling, none of which this project uses.
      - name: Free disk space
        run: |
          set -Eeuo pipefail
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      /usr/local/.ghcup
          sudo docker image prune -af
          df -h / | tail -1

      # The framework, at the commits vendor.lock names. Not submodules
      # (a deliberate decision), not committed (3.8 GB we did not write).
      - name: Restore upstream at pinned commits
        # Three, not four. `relaticle` is a Laravel application; the bench never
        # installs it and this job never reads it, so cloning it here buys
        # nothing and costs disk on a runner that has just run out.
        run: ./scripts/fetch_vendor.sh frappe erpnext crm

      - name: Confirm the checkout matches the lock
        run: ./scripts/fetch_vendor.sh --check frappe erpnext crm

      # The bench container runs as uid 1000; a runner's checkout is uid 1001.
      # Two things break on that mismatch, and neither can happen on a
      # developer's machine, where both are 1000:
      #
      #   * git refuses the vendored repositories as "dubious ownership", which
      #     bench reports as a failed `git clone` — pointing at the network;
      #   * `yarn install` for `crm`, which is exposed as a symlink, cannot
      #     create `node_modules` inside the checkout:
      #     `EACCES: permission denied, mkdir '/workspace/vendor/crm/node_modules'`.
      #
      # Aligning the ownership fixes both at the source. `bootstrap.sh` also
      # marks the paths as safe directories, which stays as defence for hosts
      # where this step cannot run.
      - name: Give the bench user the vendored trees
        run: sudo chown -R 1000:1000 frappe erpnext crm relaticle

      # Generated, never stored. A committed test password becomes a real one
      # the first time somebody copies this file to a server.
      - name: Bench configuration
        run: |
          set -Eeuo pipefail
          umask 077
          {
            echo "MYSQL_ROOT_PASSWORD=$(openssl rand -base64 24)"
            echo "ADMIN_PASSWORD=$(openssl rand -base64 24)"
            echo "SITE_NAME=korkem.localhost"
            echo "KORKEM_ENV=development"
          } > infra/frappe_bench/.env

      - name: Verify
        run: ./scripts/ci.sh backend

      # The bench says why it would not start far more clearly than the test
      # runner does, and only this job can read it.
      - name: Bench logs on failure
        if: failure()
        run: docker compose -f infra/frappe_bench/docker-compose.yml logs --tail 200 bench
