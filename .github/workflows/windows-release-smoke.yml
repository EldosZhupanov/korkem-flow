name: Windows runtime smoke
on:
  push:
    branches: [release/windows-0.3.1-build8]
    paths: [.github/workflows/windows-release-smoke.yml]
permissions:
  contents: read
  actions: read
jobs:
  smoke:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: korkem-windows-0.3.1-build8
          run-id: 41097236528
          github-token: ${{ github.token }}
          path: artifact
      - name: Launch the extracted release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Expand-Archive artifact/korkem-flow-0.3.1-windows-x64.zip bundle
          $bundle = (Resolve-Path bundle).Path
          $exe = Join-Path $bundle 'korkem_flow.exe'
          $version = (Get-Item $exe).VersionInfo
          $p = Start-Process $exe -WorkingDirectory $bundle -PassThru -RedirectStandardOutput stdout.log -RedirectStandardError stderr.log
          try {
            Start-Sleep -Seconds 15
            $p.Refresh()
            if ($p.HasExited) { throw "Release exited: $($p.ExitCode)" }
            Start-Sleep -Seconds 15
            $p.Refresh()
            if ($p.HasExited -or -not $p.Responding -or $p.MainWindowHandle -eq 0) { throw 'Release has no responsive window' }
            @{file_version=$version.FileVersion; product_version=$version.ProductVersion; alive=$true; responding=$p.Responding; window_title=$p.MainWindowTitle; seconds=30} | ConvertTo-Json | Tee-Object smoke.json
          } finally {
            if (-not $p.HasExited) { $p.CloseMainWindow() | Out-Null; Start-Sleep -Seconds 2; $p.Refresh(); if (-not $p.HasExited) { Stop-Process -Id $p.Id } }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: korkem-windows-startup-evidence
          path: |
            smoke.json
            stdout.log
            stderr.log
