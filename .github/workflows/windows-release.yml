name: Windows release
on:
  push:
    branches: [release/windows-0.3.2-build9]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          cache: true
      - name: Build and package Windows
        shell: pwsh
        working-directory: mobile/korkem_flow
        run: |
          $ErrorActionPreference = 'Stop'
          $env:JAVA_HOME = $env:JAVA_HOME_21_X64
          flutter pub get
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter build windows --release --no-pub --no-tree-shake-icons --dart-define=KORKEM_BASE_URL=https://api.korkem.asia --dart-define=KORKEM_FLAVOR=prod
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $release = Join-Path $PWD 'build/windows/x64/runner/Release'
          foreach ($file in @('korkem_flow.exe','flutter_windows.dll','data/app.so','data/icudtl.dat')) {
            if (-not (Test-Path (Join-Path $release $file))) { throw "Missing $file" }
          }
          New-Item -ItemType Directory -Force -Path ../../windows-artifact | Out-Null
          Compress-Archive -Path "$release/*" -DestinationPath ../../windows-artifact/korkem-flow-0.3.2-windows-x64.zip -CompressionLevel Optimal
          Get-FileHash ../../windows-artifact/korkem-flow-0.3.2-windows-x64.zip -Algorithm SHA256 | Format-List
      - name: Verify the extracted application starts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Expand-Archive windows-artifact/korkem-flow-0.3.2-windows-x64.zip windows-smoke
          $bundle = (Resolve-Path windows-smoke).Path
          $exe = Join-Path $bundle 'korkem_flow.exe'
          $version = (Get-Item $exe).VersionInfo
          if ($version.ProductVersion -ne '0.3.2+9') { throw "Wrong version: $($version.ProductVersion)" }
          $p = Start-Process $exe -WorkingDirectory $bundle -PassThru -RedirectStandardOutput windows-artifact/stdout.log -RedirectStandardError windows-artifact/stderr.log
          try {
            Start-Sleep -Seconds 15
            $p.Refresh()
            if ($p.HasExited) { throw "Release exited: $($p.ExitCode)" }
            Start-Sleep -Seconds 15
            $p.Refresh()
            if ($p.HasExited -or -not $p.Responding -or $p.MainWindowHandle -eq 0) { throw 'Release has no responsive window' }
            @{file_version=$version.FileVersion; product_version=$version.ProductVersion; alive=$true; responding=$p.Responding; window_title=$p.MainWindowTitle; seconds=30; source_commit='${{ github.sha }}'} | ConvertTo-Json | Tee-Object windows-artifact/smoke.json
          } finally {
            if (-not $p.HasExited) { $p.CloseMainWindow() | Out-Null; Start-Sleep -Seconds 2; $p.Refresh(); if (-not $p.HasExited) { Stop-Process -Id $p.Id } }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: korkem-windows-0.3.2-build9
          path: windows-artifact/
          retention-days: 30
