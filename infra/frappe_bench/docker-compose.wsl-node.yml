# Наложение для узла на WSL2 — единственное место, где стенд выходит за loopback.
#
# `docker-compose.yml` привязывает порты к `127.0.0.1` намеренно: стенд,
# запущенный на машине с публичным адресом, не должен от этого стать публичным
# сайтом. Это правильный запрет по умолчанию, и он остаётся.
#
# Но узел на WSL2 (ADR-0024) обязан быть виден с планшета в цехе, а это другая
# машина. Цепочка выглядит так:
#
#     планшет → 192.168.1.69:8000 (адрес Windows в сети цеха)
#             → netsh portproxy на Windows
#             → 172.20.249.227:8000 (адрес виртуальной машины WSL)
#             → контейнер стенда
#
# Последний переход не работает, пока стенд слушает только `127.0.0.1`: проброс
# на стороне Windows настроен, выглядит правильно и указывает в пустоту.
# Замерено 2026-09-01 на машине разработчика: с самого компьютера
# `localhost:8000` отвечает 200, с адреса WSL — соединение не устанавливается.
#
# Поэтому наложение отдельное, а не правка основного файла: выход за loopback
# должен оставаться поступком, который кто-то совершил осознанно.
#
# Само по себе это открывает стенд всему, что достаёт до виртуальной машины
# WSL. За NAT это Windows-хост и то, что он пробросил, — то есть ровно то, что
# описано выше. Публикацию наружу по-прежнему делает `docker-compose.public.yml`
# с TLS, а не этот файл.
#
# Применять вместе с основным:
#   docker compose -f docker-compose.yml -f docker-compose.pilot.yml \
#                  -f docker-compose.wsl-node.yml up -d

services:
  bench:
    ports: !override
      - "0.0.0.0:8000:8000"
      - "0.0.0.0:9000:9000"
