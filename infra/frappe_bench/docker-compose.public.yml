services:
  web:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app
    volumes:
      - /home/ubuntu/korkem-flow/web/.next/standalone:/app
      - /home/ubuntu/korkem-flow/web/.next/static:/app/.next/static
      - /home/ubuntu/korkem-flow/web/public:/app/public
    command: ["node", "server.js"]
    environment:
      - NODE_ENV=production
      - PORT=3000
      - KORKEM_BACKEND_URL=http://bench:8000
    depends_on:
      - bench

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - bench
      - web
    environment:
      KORKEM_PUBLIC_HOST: ${KORKEM_PUBLIC_HOST}
      KORKEM_ACME_EMAIL: ${KORKEM_ACME_EMAIL}
    volumes:
      - ./proxy/${KORKEM_PROXY_PROFILE:-webhooks}.Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - "80:80"
      - "443:443"

  bench:
    ports: !override
      - "127.0.0.1:8000:8000"

volumes:
  caddy-data:
  caddy-config:
